<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - {{ recipient }}</title>
    <style>
        :root { --bg-color: #DAE0E6; --card-bg: #ffffff; --text-color: #1c1c1c; --border-color: #ccc; }
        body.dark-mode { --bg-color: #030303; --card-bg: #1a1a1b; --text-color: #d7deda; --border-color: #343536; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; }
        .chat-container { max-width: 500px; margin: auto; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; display: flex; flex-direction: column; height: 80vh; }
        .chat-header { padding: 12px 16px; background: #0079d3; color: white; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .chat-header a { color: white; text-decoration: none; font-size: 14px; }
        .messages-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 70%; padding: 8px 12px; border-radius: 12px; font-size: 14px; word-break: break-word; }
        .msg-sent { background: #0079d3; color: white; align-self: flex-end; }
        .msg-received { background: #e4e6eb; color: #000; align-self: flex-start; }
        .time { font-size: 10px; opacity: 0.7; margin-top: 4px; text-align: right; }
        .chat-input { display: flex; padding: 10px; border-top: 1px solid var(--border-color); }
        .chat-input input { flex: 1; padding: 10px; border: 1px solid var(--border-color); border-radius: 20px; outline: none; background: transparent; color: var(--text-color); }
        .chat-input button { background: #0079d3; color: white; border: none; padding: 8px 16px; border-radius: 20px; margin-left: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <span>💬 @{{ recipient }}</span>
        <a href="/user/{{ recipient }}">Profili Gör</a>
    </div>

    <div class="messages-box" id="msgBox"></div>

    <form class="chat-input" id="chatForm">
        <input type="text" id="msgInput" placeholder="Mesajınızı yazın..." required autocomplete="off">
        <button type="submit">Göndər</button>
    </form>
</div>

<script>
    const recipient = "{{ recipient }}";
    const currentUser = "{{ current_user }}";
    const msgBox = document.getElementById('msgBox');
    const chatForm = document.getElementById('chatForm');
    const msgInput = document.getElementById('msgInput');
    let lastMsgCount = 0;

    async function loadMessages() {
        try {
            const res = await fetch(`/api/messages/${recipient}`);
            const messages = await res.json();
            
            if (messages.length !== lastMsgCount) {
                msgBox.innerHTML = '';
                if (messages.length === 0) {
                    msgBox.innerHTML = '<p style="text-align:center; color:#888; font-size:13px;">Hələ ki mesaj yoxdur. İlk mesajı sən yaz!</p>';
                } else {
                    messages.forEach(m => {
                        const div = document.createElement('div');
                        div.className = `msg ${m.sender === currentUser ? 'msg-sent' : 'msg-received'}`;
                        div.innerHTML = `<div>${m.text}</div><div class="time">${m.time}</div>`;
                        msgBox.appendChild(div);
                    });
                }
                msgBox.scrollTop = msgBox.scrollHeight;
                lastMsgCount = messages.length;
            }
        } catch (e) {
            console.error(e);
        }
    }

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = msgInput.value.trim();
        if (!text) return;
        msgInput.value = '';

        await fetch(`/api/messages/${recipient}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
        });
        
        loadMessages();
    });

    loadMessages();
    setInterval(loadMessages, 2000);

    if (localStorage.getItem('theme') === 'dark') { 
        document.body.classList.add('dark-mode'); 
    }
</script>

</body>
</html>
